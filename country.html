<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="country.css" />
    <script src="country.js" defer> </script>
</head>

<body>
    <header class="header-container">
        <div class="header-content">
            <h1 class="title">Where in the world?</h1>
            <p class="dark"><i class="fa-regular fa-moon"></i> Dark Mode</p>
        </div>
    </header>
    <main>
        <a class="back-box" href="#" onclick="history.back()" ><i class="fa-solid fa-arrow-left"></i> Back</a>
        <div class="country-details">
            <img class="my-flag" src="" alt="">
            <div class="details-text-container">
                <h1>Botswana</h1>
                <div class="details-text">

                    <p><b>Native Name</b>: <span class="native-name">Botswana</span></p>
                    <p><b>Population</b>:<span class="population">6876688 </span></p>
                    <p><b>Region</b>:<span class="region">Botswana</span></p>
                    <p><b>Sub Region</b>: <span class="sub-region"> Botswana</span></p>
                    <p><b>Capital</b>: <span class="capital">Delhi</span></p>
                    <p><b>Top level Domain</b>:<span class="tld">be</span></p>
                    <p><b>Currency</b>: <span class="currency">Euro</span></p>
                    <p><b>Language</b>: <span class="language">French,Dutch</span></p>


                </div>
                <div class="border-country">
                    <b>Border Country :</b>
                </div>
            </div>
        </div>
    </main>

</body>

</html>
